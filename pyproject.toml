[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashcow-studio"
version = "0.1.0"
description = "Turns competitor YouTube channels into finished faceless videos with a human in the loop at every stage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pywebview>=5.0",
    "python-slugify>=8",
    "python-multipart>=0.0.18",
    "pillow>=10",
    "pyyaml>=6",
    "yt-dlp[default]>=2026.8.19",
    "youtube-transcript-api>=1.2",
    "anthropic>=1.0",
    "google-genai>=1.0",
    "pypdf>=5",
    "httpx>=0.27",
    "arabic-reshaper>=3",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
ccs = "cashcow_studio.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
cashcow_studio = ["py.typed", "llm/prompts/*.md", "policy/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = [
    "live: calls the real Claude API; skipped unless ANTHROPIC_API_KEY is set",
]
