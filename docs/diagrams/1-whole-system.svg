  <text x="250" y="372" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">channel data, frameworks, voice samples, music</text>
  <rect x="400" y="336" width="200" height="48" rx="4" stroke-dasharray="5 4"/>
  <text x="500" y="356" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Local drive</text>
  <text x="500" y="372" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">per-video projects, cache, exports</text>
  <rect x="620" y="336" width="240" height="48" rx="4" stroke-dasharray="5 4"/>
  <text x="740" y="356" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">GitHub</text>
  <text x="740" y="372" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">code, installer, automatic updates</text>
  <line x1="300" y1="336" x2="340" y2="300" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text x="290" y="326" font-size="10.5" text-anchor="end" fill="#121826" stroke="none" opacity="0.75">reads and writes</text>
  <line x1="500" y1="336" x2="500" y2="300" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text x="508" y="326" font-size="10.5" fill="#121826" stroke="none" opacity="0.75">reads and writes</text>
  <line x1="720" y1="336" x2="680" y2="300" marker-end="url(#a1)"/>
  <text x="730" y="326" font-size="10.5" fill="#121826" stroke="none" opacity="0.75">installs, updates</text>
</svg>