<svg style="font-family: Arial, Helvetica, sans-serif" xmlns="http://www.w3.org/2000/svg" width="2000" height="800" viewBox="0 0 1000 400" role="img" aria-label="Inputs on the left feed the Cashflow Studio app in the middle, which produces videos, thumbnails and a provenance bundle on the right; three stores below exchange data with the app." fill="none" stroke="#121826" stroke-width="1.4">
  <rect x="0" y="0" width="1000" height="400" fill="#FFFFFF"/><defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121826" stroke="none"/></marker>
  </defs>
  <text x="24" y="52" font-size="12" fill="#121826" stroke="none" font-weight="600">You provide (Channel Setup form, once per channel)</text>
  <rect x="24" y="70" width="200" height="44" rx="4"/><text x="124" y="97" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Competitor channel URLs</text>
  <rect x="24" y="124" width="200" height="44" rx="4"/><text x="124" y="151" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Frameworks: title, script, style</text>
  <rect x="24" y="178" width="200" height="44" rx="4"/><text x="124" y="205" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Cloned voice (ai33)</text>
  <rect x="24" y="232" width="200" height="44" rx="4"/><text x="124" y="259" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Image tool (Google)</text>
