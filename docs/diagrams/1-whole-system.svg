  <rect x="604" y="106" width="84" height="28" rx="4"/><text x="646" y="124" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Storyboard</text>
  <line x1="400" y1="120" x2="412" y2="120"/><line x1="496" y1="120" x2="508" y2="120"/><line x1="592" y1="120" x2="604" y2="120"/>
  <polygon points="406,114 412,120 406,126 400,120" fill="#FFC000" stroke="none"/>
  <polygon points="502,114 508,120 502,126 496,120" fill="#FFC000" stroke="none"/>
  <polygon points="598,114 604,120 598,126 592,120" fill="#FFC000" stroke="none"/>
  <polyline points="646,134 646,150 358,150 358,170" marker-end="url(#a1)"/>
  <polygon points="502,144 508,150 502,156 496,150" fill="#FFC000" stroke="none"/>
  <rect x="316" y="170" width="84" height="28" rx="4"/><text x="358" y="188" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Voice</text>
  <rect x="412" y="170" width="84" height="28" rx="4"/><text x="454" y="188" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Images</text>
  <rect x="508" y="170" width="84" height="28" rx="4"/><text x="550" y="188" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Edit</text>
  <rect x="604" y="170" width="84" height="28" rx="4"/><text x="646" y="188" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Export</text>
  <line x1="400" y1="184" x2="412" y2="184"/><line x1="496" y1="184" x2="508" y2="184"/><line x1="592" y1="184" x2="604" y2="184"/>
  <polygon points="406,178 412,184 406,190 400,184" fill="#FFC000" stroke="none"/>
