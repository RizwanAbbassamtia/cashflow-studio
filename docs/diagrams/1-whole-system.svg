  <line x1="224" y1="146" x2="300" y2="146" marker-end="url(#a1)"/>
  <line x1="224" y1="200" x2="300" y2="200" marker-end="url(#a1)"/>
  <line x1="224" y1="254" x2="300" y2="254" marker-end="url(#a1)"/>
  <rect x="300" y="60" width="400" height="240" rx="8" stroke-width="1.8"/>
  <text x="500" y="86" font-size="14" text-anchor="middle" fill="#121826" stroke="none" font-weight="600">Cashflow Studio on each laptop</text>
  <rect x="316" y="106" width="84" height="28" rx="4"/><text x="358" y="124" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Research</text>
  <rect x="412" y="106" width="84" height="28" rx="4"/><text x="454" y="124" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none">Title</text>
