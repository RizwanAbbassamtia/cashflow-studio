  <text x="500" y="256" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">calls out to: Claude API · ai33 voice · Google images · FFmpeg (local)</text>
  <text x="500" y="280" font-size="11.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">quality gates: originality, visual variety, voice consent, disclosure</text>
  <text x="776" y="52" font-size="12" fill="#121826" stroke="none" font-weight="600">You get (per video)</text>
  <rect x="776" y="86" width="200" height="44" rx="4"/><text x="876" y="105" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Final video</text><text x="876" y="121" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">720p · 1080p · 4K, 16:9 or 9:16</text>
  <rect x="776" y="146" width="200" height="44" rx="4"/><text x="876" y="165" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Thumbnail + SEO pack</text><text x="876" y="181" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">title, tags, description, chapters</text>
  <rect x="776" y="206" width="200" height="44" rx="4"/><text x="876" y="225" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Provenance bundle</text><text x="876" y="241" font-size="11" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">research, versions, review log</text>
