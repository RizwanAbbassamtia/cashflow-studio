<svg style="font-family: Arial, Helvetica, sans-serif" xmlns="http://www.w3.org/2000/svg" width="2000" height="640" viewBox="0 0 1000 320" role="img" aria-label="GitHub builds an installer that updates each editor's laptop; laptops sync channel data with a shared Google Drive folder, call cloud services with per-user keys, and read YouTube through yt-dlp." fill="none" stroke="#121826" stroke-width="1.4">
  <rect x="0" y="0" width="1000" height="320" fill="#FFFFFF"/><defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121826" stroke="none"/></marker>
  </defs>
  <rect x="20" y="40" width="190" height="48" rx="6"/>
  <text x="115" y="60" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">GitHub repository</text>
  <text x="115" y="77" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">code only, pull request per milestone</text>
  <line x1="115" y1="88" x2="115" y2="136" marker-end="url(#a5)"/>
  <text x="124" y="116" font-size="10.5" fill="#121826" stroke="none" opacity="0.75">CI builds</text>
  <rect x="20" y="136" width="190" height="48" rx="6"/>
  <text x="115" y="156" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Installer + updates</text>
  <text x="115" y="173" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">GitHub Releases, checksum, auto-update</text>
  <line x1="210" y1="160" x2="310" y2="160" marker-end="url(#a5)"/>
  <text x="260" y="152" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">install</text>
  <rect x="310" y="14" width="210" height="292" rx="8" stroke-dasharray="6 4" opacity="0.6"/>
  <rect x="330" y="30" width="170" height="64" rx="6"/>
  <text x="415" y="52" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Editor A laptop</text>
  <text x="415" y="68" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">app · own API keys · local media</text>
  <text x="415" y="84" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">FFmpeg, yt-dlp, fonts bundled</text>
  <rect x="330" y="128" width="170" height="64" rx="6"/>
  <text x="415" y="150" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Editor B laptop</text>
  <text x="415" y="166" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">app · own API keys · local media</text>
  <text x="415" y="182" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">no GPU needed</text>
  <rect x="330" y="226" width="170" height="64" rx="6"/>
  <text x="415" y="248" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Editor C laptop</text>
  <text x="415" y="264" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">app · own API keys · local media</text>
  <text x="415" y="280" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">Windows 10 or 11</text>
  <rect x="620" y="24" width="360" height="60" rx="6" stroke-dasharray="5 4"/>
  <text x="800" y="46" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">Cloud services, paid per user</text>
  <text x="800" y="64" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">Claude API (scripts, storyboard, QA) · ai33 voice · Google images</text>
  <line x1="520" y1="54" x2="620" y2="54" marker-end="url(#a5)"/>
  <text x="570" y="46" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">own key each</text>
  <rect x="620" y="124" width="360" height="72" rx="6" stroke="#9A6B00" stroke-width="1.8"/>
  <text x="800" y="148" font-size="12.5" text-anchor="middle" fill="#9A6B00" stroke="none" font-weight="600">Shared Google Drive folder</text>
  <text x="800" y="166" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">channels/&lt;slug&gt;/channel.json · frameworks · style refs</text>
  <text x="800" y="182" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">voice samples · music · thumbnail templates</text>
  <line x1="520" y1="160" x2="620" y2="160" marker-start="url(#a5)" marker-end="url(#a5)"/>
  <text x="570" y="152" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">Drive sync</text>
  <rect x="620" y="236" width="360" height="54" rx="6" stroke-dasharray="5 4"/>
  <text x="800" y="258" font-size="12.5" text-anchor="middle" fill="#121826" stroke="none">YouTube</text>
  <text x="800" y="275" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">read only through yt-dlp: titles, views, dates, transcripts, thumbnails</text>
  <line x1="620" y1="262" x2="520" y2="262" marker-end="url(#a5)"/>
  <text x="570" y="254" font-size="10.5" text-anchor="middle" fill="#121826" stroke="none" opacity="0.75">competitor data</text>
</svg>