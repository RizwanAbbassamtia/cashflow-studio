# Provider catalogue for CashCow Studio: the voice and image tools the app knows about.
#
# No secrets live here. `key_env` is only the NAME of the environment variable that holds the
# key; the value itself is saved per user in Settings > API keys (<app_data_dir>/.env).
#
# `adapter`: ready   = works in this version
#            stub    = listed, waiting for API details (every call reports that)
#            planned = arrives in a later version (shown in Settings, not selectable yet)
# Prices are in US dollars per billing unit; `verified_on` is the day they were last checked.
# Loaded by backend/cashcow_studio/providers/catalog.py; a broken entry is skipped with a
# log line, and the built-in defaults cover anything missing.

schema_version: 1

voice:
  mock:
    name: "Mock voice (offline)"
    adapter: ready
    clone: true
    languages: []            # empty = any language
    timestamp_granularity: word
    billing_unit: free
    price_per_unit_usd: 0
    max_chars: null
    key_env: ""
    notes: "Writes silent audio with evenly spaced word timings. For tests and demos."

  ai33:
    name: "ai33 voice clone"
    adapter: stub
    clone: true
    languages: []            # unknown until the documentation arrives
    timestamp_granularity: unknown
    billing_unit: character
    price_per_unit_usd: 0    # unknown
    max_chars: null
    key_env: AI33_API_KEY
    docs_url: ""
    notes: "The team's own voice tool, named 2026-10-09. Website and API documentation still needed. Once known, fill in the http section below (same shape as generic_http) and the app calls it without a code change."
    # To connect ai33 without code, uncomment and fill in this recipe (see generic_http):
    # http:
    #   url: "https://api.ai33.example/v1/tts"
    #   method: POST
    #   headers: {Authorization: "Bearer ${AI33_API_KEY}", Content-Type: application/json}
    #   body_template: {text: "{{text}}", voice_id: "{{voice}}", language: "{{language}}", speed: "{{speed}}"}
    #   response: {kind: json, audio_field: audio, audio_encoding: base64, audio_format: mp3, word_timings_path: words, word_fields: {text: word, start: start, end: end}, time_unit: s}

  generic_http:
    # Template for any voice tool with a plain HTTP API. Copy this block under a new id (or
    # fill in ai33's http section above). ${NAME} in headers/url is replaced by that
    # environment variable (saved in Settings > API keys); {{text}} {{voice}} {{language}}
    # {{speed}} {{model}} {{style}} {{sample_rate}} are filled in per sentence. A body value
    # that is exactly one placeholder keeps its type ("{{speed}}" is sent as a number).
    name: "Generic HTTP voice (set up in this file)"
    adapter: ready
    clone: false
    languages: []
    timestamp_granularity: unknown
    billing_unit: character
    price_per_unit_usd: 0
    max_chars: null
    key_env: GENERIC_VOICE_API_KEY
    default_model: ""
    notes: "Driven by the http section below; nothing is called until url is filled in."
    http:
      url: ""                # e.g. https://api.example.com/v1/tts ; empty = not configured
      method: POST
      headers:
        Authorization: "Bearer ${GENERIC_VOICE_API_KEY}"
        Content-Type: application/json
      body_template:
        text: "{{text}}"
        voice: "{{voice}}"
        language: "{{language}}"
        speed: "{{speed}}"
      response:
        kind: json           # json = audio inside a JSON answer; audio = the answer IS the file
        audio_field: audio   # dotted path to base64 (or hex) audio text
        audio_encoding: base64
        audio_url_field: ""  # or: dotted path to a URL the audio is downloaded from
        audio_format: mp3    # what the bytes are: mp3, wav, flac, ogg, pcm (+ pcm_sample_rate)
        word_timings_path: ""   # dotted path to a list of word timings, if the tool has them
        word_fields: {text: text, start: start, end: end, confidence: confidence}
        time_unit: s         # s or ms

  minimax:
    name: "MiniMax Speech"
    adapter: ready
    clone: true
    languages: ["English", "Spanish", "Hindi", "Arabic", "Portuguese", "Indonesian", "Japanese", "German", "French", "Russian", "Vietnamese", "Turkish", "Korean", "Italian"]
    timestamp_granularity: word
    billing_unit: character
    price_per_unit_usd: 0.0001   # speech-2.8-hd: $100 per 1M characters (turbo: $60)
    max_chars: 10000
    key_env: MINIMAX_API_KEY
    extra_key_envs: [MINIMAX_GROUP_ID]
    models: [speech-2.8-hd, speech-2.8-turbo]
    default_model: speech-2.8-hd
    base_url: "https://api.minimax.io"
    docs_url: "https://platform.minimax.io/docs/api-reference/speech-t2a-http"
    notes: "Per-sentence synthesis with subtitle timing (phrases cut into words by the app); rapid voice cloning $1.50 per voice. Also needs MINIMAX_GROUP_ID."
    verified_on: "2026-10-09"

  cartesia:
    name: "Cartesia Sonic"
    adapter: ready
    clone: true
    languages: []
    timestamp_granularity: word
    billing_unit: character
    price_per_unit_usd: 0        # credit-based plans; fill in from the plan
    max_chars: null
    key_env: CARTESIA_API_KEY
    models: [sonic-3, sonic-2, sonic-turbo]
    default_model: sonic-3
    base_url: "https://api.cartesia.ai"
    docs_url: "https://docs.cartesia.ai/api-reference/tts/sse"
    notes: "Word timestamps come from the streaming (SSE) endpoint, which the adapter uses."
    verified_on: "2026-10-09"

  inworld:
    name: "Inworld TTS"
    adapter: planned
    clone: true
    languages: []
    timestamp_granularity: word
    billing_unit: character
    price_per_unit_usd: 0.000025 # TTS-2 on-demand $25 per 1M characters (Flash: $15)
    max_chars: null
    key_env: INWORLD_API_KEY
    docs_url: "https://docs.inworld.ai/"
    notes: "Word and character timestamps on every language; clone from 3-30 s of audio."
    verified_on: "2026-10-09"

  fish_audio:
    name: "Fish Audio"
    adapter: planned
    clone: true
    languages: []
    timestamp_granularity: none
    billing_unit: character
    price_per_unit_usd: 0        # billed per UTF-8 byte; fill in from the plan
    max_chars: null
    key_env: FISH_AUDIO_API_KEY
    docs_url: "https://docs.fish.audio/"
    notes: "No word timestamps: timings come from the forced aligner."

image:
  mock:
    name: "Mock images (offline)"
    adapter: ready
    models: [mock-placeholder]
    default_model: mock-placeholder
    aspects: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "4:5", "5:4", "21:9"]
    sizes: ["1K", "2K"]      # placeholders stay small: 2K is the largest the mock offers
    max_reference_images: 14
    provenance: {c2pa: false, synthid: false}
    price_per_image_usd: 0
    key_env: ""
    notes: "Draws the prompt on a coloured placeholder. For tests and demos."

  gemini:
    name: "Google Gemini images (Nano Banana)"
    adapter: ready
    # Verify the ids against https://ai.google.dev/gemini-api/docs/models before shipping;
    # the steps are in backend/cashcow_studio/providers/image/gemini.py.
    models: [gemini-nano-banana-2.1, gemini-3-pro-image, gemini-3.1-flash-lite-image]
    default_model: gemini-nano-banana-2.1
    aspects: ["1:1", "3:2", "2:3", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
    sizes: ["1K", "2K", "4K"]
    max_reference_images: 14
    provenance: {c2pa: null, synthid: true}   # every Gemini image carries a SynthID watermark
    price_per_image_usd: 0.0504
    price_by_size_usd: {"1K": 0.0336, "2K": 0.0504, "4K": 0.113}   # gemini-nano-banana-2.1, standard
    key_env: GEMINI_API_KEY
    docs_url: "https://ai.google.dev/gemini-api/docs/image-generation"
    notes: "Default scene-image model. gemini-3-pro-image (Nano Banana Pro) costs about 4x and suits thumbnails with text; gemini-3.1-flash-lite-image is 1K only."
    verified_on: "2026-10-09"
